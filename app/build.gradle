plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace = 'tn.eluea.kgpt'
    compileSdk = 36

    defaultConfig {
        applicationId = "tn.eluea.kgpt"
        minSdk = 26
        targetSdk = 36
        versionCode = 9
        versionName = "4.0.8"

        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64'
        }
    }

    signingConfigs {
        release {
            storeFile = file("keystore/kgpt_release.jks")
            storePassword = "kgptpassword"
            keyAlias = "kgpt"
            keyPassword = "kgptpassword"
        }
        debug {
            storeFile = file("keystore/kgpt_release.jks")
            storePassword = "kgptpassword"
            keyAlias = "kgpt"
            keyPassword = "kgptpassword"
        }
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles(getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro')
            signingConfig = signingConfigs.release
        }
        debug {
            signingConfig = signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    packaging {
        jniLibs {
            useLegacyPackaging = true
            excludes += [
                '**/*.so',
                'lib/**',
                'lib/*/**',
                '**/libpython*.so',
                '**/libffmpeg*.so',
                '**/libffprobe*.so',
                '**/libyoutubedl*.so',
                '**/libqjs*.so'
            ]
        }
        resources {
            excludes += ['META-INF/INDEX.LIST', 'META-INF/DEPENDENCIES', 'META-INF/LICENSE',
                         'META-INF/LICENSE.txt', 'META-INF/license.txt', 'META-INF/NOTICE',
                         'META-INF/NOTICE.txt', 'META-INF/notice.txt', 'META-INF/ASL2.0',
                         'META-INF/*.kotlin_module']
        }
    }

    buildFeatures {
        buildConfig = true
    }
}

android.applicationVariants.all { variant ->
    variant.outputs.all { output ->
        def appName = "KGPT"
        def buildType = variant.buildType.name
        def versionName = variant.versionName
        def versionCode = variant.versionCode
        outputFileName = "${appName}-${buildType}-v${versionName}.apk"
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.14.0-alpha01'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:5.11.0'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'

    implementation 'com.google.guava:guava:31.0.1-android'
    implementation 'org.reactivestreams:reactive-streams:1.0.4'

    // WorkManager for background update checking
    implementation 'androidx.work:work-runtime:2.9.0'
    
    // DocumentFile for folder picker
    implementation 'androidx.documentfile:documentfile:1.0.1'

    // LSPosed Modern API 102 & Service (Vector compatible)
    compileOnly 'io.github.libxposed:api:102.0.0'
    implementation 'io.github.libxposed:service:101.0.0'

    // Embedded Universal Media Downloader (yt-dlp + ffmpeg)
    implementation 'io.github.junkfood02.youtubedl-android:library:0.18.1'
    implementation 'io.github.junkfood02.youtubedl-android:ffmpeg:0.18.1'

    // Lottie Animation Library
    implementation 'com.airbnb.android:lottie:6.4.0'

    // Google Play Services Auth & Google Drive API
    implementation 'com.google.android.gms:play-services-auth:21.2.0'
    implementation('com.google.api-client:google-api-client-android:2.6.0') {
        exclude group: 'org.apache.httpcomponents'
        exclude group: 'com.google.guava'
    }
    implementation('com.google.apis:google-api-services-drive:v3-rev20220815-2.0.0') {
        exclude group: 'org.apache.httpcomponents'
        exclude group: 'com.google.guava'
    }
    implementation 'com.google.http-client:google-http-client-gson:1.44.1'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}
