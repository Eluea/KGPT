plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Signing credentials are loaded from keystore.properties (gitignored) or
// environment variables — never commit real passwords to the repository.
// See keystore.properties.example for the expected format.
def keystoreProps = new Properties()
def keystorePropsFile = rootProject.file("keystore.properties")
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}
def ksStoreFile = keystoreProps['storeFile'] ?: System.getenv('KGPT_STORE_FILE') ?: 'keystore/kgpt_release.jks'
def ksStorePassword = keystoreProps['storePassword'] ?: System.getenv('KGPT_STORE_PASSWORD') ?: ''
def ksKeyAlias = keystoreProps['keyAlias'] ?: System.getenv('KGPT_KEY_ALIAS') ?: 'kgpt'
def ksKeyPassword = keystoreProps['keyPassword'] ?: System.getenv('KGPT_KEY_PASSWORD') ?: ''

if (!file("$ksStoreFile").exists()) {
    logger.warn("KGPT: signing keystore not found at '$ksStoreFile'. " +
            "Create keystore.properties in the repo root (see keystore.properties.example) " +
            "or set KGPT_STORE_FILE/KGPT_STORE_PASSWORD/KGPT_KEY_ALIAS/KGPT_KEY_PASSWORD. " +
            "Release builds will fail until then.")
}

android {
    namespace = 'tn.eluea.kgpt'
    compileSdk = 36

    defaultConfig {
        applicationId = "tn.eluea.kgpt"
        minSdk = 26
        targetSdk = 36
        versionCode = 414
        versionName = "4.1.4"

        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64'
        }
    }

    signingConfigs {
        release {
            storeFile = file("$ksStoreFile")
            storePassword = "$ksStorePassword"
            keyAlias = "$ksKeyAlias"
            keyPassword = "$ksKeyPassword"
        }
        debug {
            // Debug builds fall back to the default debug keystore when no
            // release credentials are configured on this machine.
            if (file("$ksStoreFile").exists() && ksStorePassword) {
                storeFile = file("$ksStoreFile")
                storePassword = "$ksStorePassword"
                keyAlias = "$ksKeyAlias"
                keyPassword = "$ksKeyPassword"
            }
        }
    }

    buildTypes {
        release {
            debuggable false
            minifyEnabled = false
            proguardFiles(getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro')
            signingConfig = signingConfigs.release
        }
        debug {
            debuggable true
            // With keystore.properties present, debug builds are signed with the
            // release key (historical behavior). Without credentials, leave
            // signingConfig unset so AGP applies its auto-managed default debug
            // keystore and fresh machines can still build & install.
            def hasReleaseCreds = file("$ksStoreFile").exists() && ksStorePassword?.trim()
            if (hasReleaseCreds) {
                signingConfig = signingConfigs.debug
            }
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    packaging {
        jniLibs {
            useLegacyPackaging = true
            excludes += [
                '**/libpython.zip.so',
                '**/libffmpeg.zip.so'
            ]
        }
        resources {
            excludes += ['META-INF/INDEX.LIST', 'META-INF/DEPENDENCIES', 'META-INF/LICENSE',
                         'META-INF/LICENSE.txt', 'META-INF/license.txt', 'META-INF/NOTICE',
                         'META-INF/NOTICE.txt', 'META-INF/notice.txt', 'META-INF/ASL2.0',
                         'META-INF/*.kotlin_module']
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
        disable 'BlockedPrivateApi'
    }

    buildFeatures {
        buildConfig = true
    }
}

android.applicationVariants.all { variant ->
    variant.outputs.all { output ->
        def appName = "KGPT"
        def buildType = variant.buildType.name
        def versionName = variant.versionName
        def versionCode = variant.versionCode
        outputFileName = "${appName}-${buildType}-v${versionName}.apk"
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.16.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.14.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:5.12.0'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'

    implementation 'org.reactivestreams:reactive-streams:1.0.4'

    // WorkManager for background update checking
    implementation 'androidx.work:work-runtime:2.11.2'
    
    // DocumentFile for folder picker
    implementation 'androidx.documentfile:documentfile:1.1.0'

    // LSPosed Modern API 102 & Service (Vector compatible)
    compileOnly 'io.github.libxposed:api:102.0.0'
    implementation 'io.github.libxposed:service:101.0.0' // 102 requires compileSdk 37 — revisit when AGP/SDK 37 ships
    // Expose the API to unit tests (compile-only deps are absent from the
    // unit test classpath, which broke test compilation)
    testImplementation 'io.github.libxposed:api:102.0.0'

    // Embedded Universal Media Downloader (yt-dlp + ffmpeg)
    implementation 'io.github.junkfood02.youtubedl-android:library:0.18.1'
    implementation 'io.github.junkfood02.youtubedl-android:ffmpeg:0.18.1'

    // Lottie Animation Library
    implementation 'com.airbnb.android:lottie:6.7.1'

    // Google Play Services Auth & Google Drive API
    implementation 'com.google.android.gms:play-services-auth:21.2.0'
    implementation('com.google.api-client:google-api-client-android:2.6.0') {
        exclude group: 'org.apache.httpcomponents'
        exclude group: 'com.google.guava'
    }
    implementation('com.google.apis:google-api-services-drive:v3-rev20220815-2.0.0') {
        exclude group: 'org.apache.httpcomponents'
        exclude group: 'com.google.guava'
    }
    implementation 'com.google.http-client:google-http-client-gson:1.44.1'

    // DexKit for robust DEX string searching
    implementation 'org.luckypray:dexkit:2.2.0'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}
